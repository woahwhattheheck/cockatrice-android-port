apply plugin: 'com.android.application'
def releaseProperties = new Properties()
def releasePropertiesFile = rootProject.file('signing/keystore.properties')
if (releasePropertiesFile.exists()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}
android {
    namespace 'com.wrapper.cockatrice'
    compileSdk 34
    buildFeatures { buildConfig true }
    signingConfigs {
        if (!releaseProperties.isEmpty()) {
            localRelease {
                storeFile rootProject.file(releaseProperties.getProperty('storeFile'))
                storePassword releaseProperties.getProperty('storePassword')
                keyAlias releaseProperties.getProperty('keyAlias')
                keyPassword releaseProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            if (!releaseProperties.isEmpty()) signingConfig signingConfigs.localRelease
        }
    }
    defaultConfig {
        // Install beside every old abomination, never over the top of it.
        applicationId "org.cockatrice.onetap"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "0.1.0-rc4"
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            // The original giant payloads remain untouched and are NOT shipped.
            assets.srcDirs = ['build/generated/standalone-assets']
            jniLibs.srcDirs = ['build/generated/standalone-jni']
        }
    }
    androidResources { noCompress += 'zip' }
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += '**/*.so'
        }
    }
}
tasks.register('checkBundledRuntime') {
    doLast {
        if (!file('build/generated/standalone-assets/runtime.json').exists()) {
            throw new GradleException('Run python3 tools/prepare_runtime.py before building (after clean, too).')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'checkBundledRuntime' }
